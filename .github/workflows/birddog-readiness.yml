name: Birddog readiness

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Birddog readiness checks
        run: scripts/check_open_source_ready.sh
